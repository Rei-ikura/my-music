
<!DOCTYPE html>
<html lang="ja">

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta charset="UTF-8">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #090b10;
    color: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

.app {
    max-width: 1000px;
    margin: 20px auto;
    background: #151820;
    border-radius: 24px;
    overflow: hidden;
    box-shadow:
        0 20px 70px rgba(0,0,0,.45);
}

.header {
    padding: 25px;
    background:
        linear-gradient(
            135deg,
            #353d55,
            #15171d
        );
}

.logo {
    font-size: 28px;
    font-weight: 800;
}

.subtitle {
    color: #9299aa;
    font-size: 13px;
    margin-top: 5px;
}

.player {
    padding: 24px;
}

.video {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 16px;
    overflow: hidden;
}

#yt {
    width: 100%;
    height: 100%;
}

.now-title {
    font-size: 21px;
    font-weight: 800;
    margin-top: 16px;
}

.now-time {
    color: #8992a4;
    font-size: 12px;
    margin-top: 5px;
}

.progress {
    width: 100%;
    height: 6px;
    margin-top: 12px;
    margin-left: 0;
    margin-right: 0;
    padding: 0;
    display: block;
    accent-color: var(--theme-accent, #f7c8d8);
}


.controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 12px;
}

.control {
    width: 45px;
    height: 45px;
    border: 0;
    border-radius: 50%;
    background: #303642;
    color: white;
    cursor: pointer;
    font-size: 17px;
}

.control.main {
    width: 58px;
    height: 58px;
    background: white;
    color: #111;
    font-size: 22px;
}

.section {
    padding: 24px;
    border-top: 1px solid #292e38;
}

.title {
    font-weight: 800;
    font-size: 18px;
    margin-bottom: 13px;
}

.url-row {
    display: flex;
    gap: 8px;
}

input {
    background: #0c0e13;
    color: white;

    border-radius: 9px;
    padding: 12px;
    outline: none;
}

input:focus {
    border-color: #778197;
}

.url {
    flex: 1;
}

.button {
    border: 0;
    border-radius: 9px;
    padding: 11px 16px;
    cursor: pointer;
    font-weight: 700;
}

.white {
    background: white;
    color: #111;
}

.theme-buttons + * {
    --theme-accent: #f7c8d8;
}

.button.white {
    background: var(--theme-accent, white);

}

.control.main {

    color: var(--theme-accent-text, #111);
}

.filter.active {

}

/* =========================
   PASTEL COLORS
========================= */

.theme-buttons {

}

.theme-button {

.theme-blue {

}

<body>

<div class="app">


<div class="header">

    <div class="logo">
        🎵 My Music
    </div>

    <div class="subtitle">
        YouTube Playlist & Clip Player
    </div>

</div>

<div class="tabs">

    <button
        id="playerTab"
        class="tab active"
        onclick="showTab('player')"
    >
        🎵 プレイヤー
    </button>

    <button
        id="playlistTab"
        class="tab"
        onclick="showTab('playlist')"
    >
        📋 プレイリスト
    </button>

</div>


<!-- =========================
     PLAYER
========================= -->

<div class="player">

    <div class="video">
        <div id="yt"></div>
    </div>

    <div
        id="nowTitle"
        class="now-title"
    >
        曲を選択してください
    </div>

    <div
        id="nowTime"
        class="now-time"
    >
        0:00 / 0:00
    </div>

    <input
        id="progress"
        class="progress"
        type="range"
        min="0"
        max="100"
        value="0"
    >

    <div class="controls">

        <button
            class="control"
            onclick="previousItem()"
            title="前へ"
        >
            ⏮
        </button>

        <button
            class="control"
            onclick="back10()"
            title="10秒戻る"
        >
            ⏪
        </button>

        <button
            id="play"
            class="control main"
            onclick="togglePlay()"
            title="再生 / 一時停止"
        >
            ▶
        </button>

        <button
            class="control"
            onclick="forward10()"
            title="10秒進む"
        >
            ⏩
        </button>

        <button
            class="control"
            onclick="nextItem()"
            title="次へ"
        >
            ⏭
        </button>

    </div>

</div>


<!-- =========================
     ADD
========================= -->

<div class="section">

    <div class="title">
        ＋ YouTubeを追加
    </div>

    <div class="url-row">

        <input
            id="url"
            class="url"
            placeholder="YouTube URLを貼り付け"
        >

        <button
            class="button white"
            onclick="loadVideo()"
        >
            読み込む
        </button>

    </div>

    <div
        id="status"
        class="status"
    ></div>

    <div class="add-buttons">

        <button

            onclick="addNormalVideo()"

    </div>


    <!-- CLIP -->

    <div class="clip-box">

        <div class="title">
            ✂️ 切り抜きを追加

        </div>

        <div class="clip-row">

            <input

                placeholder="終了 1:27:10"
            >

            <button

            <input

========================= -->

            class="filter"

    <!-- BACKUP -->

        <div class="title">
            💾 プレイリストのバックアップ
        </div>

        <div class="backup-buttons">

            <button
                class="button gray"
                onclick="exportPlaylistJSON()"
            >
                📤 保存
            </button>

                class="button gray"
                onclick="importPlaylistJSON()"
            >
                📥 読み込み
            </button>

        </div>

        <div class="backup-note">

            「保存」でプレイリストをJSONファイルにできます。<br>
            曲・切り抜き・タイトル・お気に入り・並び順などを保存できます。<br>
            ※YouTube動画そのものは保存されません。

        </div>

    </div>


    <div id="playlist"></div>

</div>


</div>


<script>


/* =========================================================
   GLOBAL
========================================================= */

let player = null;

let playerReady = false;

let currentVideoId = null;

let currentIndex = -1;

let filter = "all";

let shuffle = false;

let repeat = false;

let playlist = [];

let draggedIndex = null;

let savedCurrentIndex = -1;
let savedCurrentTime = 0;

/* =========================================================
   STORAGE
========================================================= */

function save() {

    try {

        localStorage.setItem(
            "my_music_playlist_v4",
            JSON.stringify(playlist)
        );

    }

    catch (e) {

        console.warn(
            "localStorage保存失敗:",
            e
        );

    }

}


function load() {

    try {

        let saved =
            localStorage.getItem(
                "my_music_playlist_v4"
            );


        /*
           v4がなければ、
           以前のv3も探す
        */

        if (!saved) {

            saved =
                localStorage.getItem(
                    "my_music_playlist_v3"
                );

        }


        if (saved) {

            const data =
                JSON.parse(saved);

            if (Array.isArray(data)) {

                playlist = data;

            }

        }

    }

    catch (e) {

        console.warn(
            "プレイリスト読み込み失敗:",
            e
        );

        playlist = [];

    }


    renderPlaylist();

}


/* =========================================================
   JSON EXPORT
========================================================= */

function exportPlaylistJSON() {

    try {

        const data = {

            version: 1,

            exportedAt:
                new Date().toISOString(),

            playlist: playlist

        };


        const json =
            JSON.stringify(
                data,
                null,
                2
            );


        const blob =
            new Blob(
                [json],
                {
                    type:
                        "application/json"
                }
            );


        const url =
            URL.createObjectURL(blob);


        const a =
            document.createElement("a");


        a.href = url;

        a.download =
            "my_music_playlist.json";


        document.body.appendChild(a);

        a.click();

        a.remove();


        setTimeout(
            function() {

                URL.revokeObjectURL(url);

            },
            1000
        );


        setStatus(
            "📤 プレイリストを保存しました！"
        );

    }

    catch (e) {

        alert(

/* =========================================================
   JSON IMPORT
========================================================= */

function importPlaylistJSON() {

    const input =
        document.createElement("input");


    input.type = "file";

    input.accept =
        ".json,application/json";


    input.onchange =
        function(event) {

            const file =
                event.target.files[0];


            if (!file) {

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                function() {

                    try {

                        const data =
                            JSON.parse(
                                reader.result
                            );


                        let imported;


                        /*
                           新形式
                        */

                        if (
                            data &&
                            Array.isArray(
                                data.playlist
                            )
                        ) {

                            imported =
                                data.playlist;

                        }


                        /*
                           古い配列形式
                        */

                        else if (
                            Array.isArray(data)
                        ) {

                            imported =
                                data;

                        }


                        else {

                            throw new Error(
                                "プレイリストデータが見つかりません"
                            );

                        }


                        /*
                           最低限チェック
                        */

                        imported =
                            imported.filter(
                                function(item) {

                                    return (
                                        item &&
                                        item.videoId
                                    );

                                }
                            );


                        if (
                            !confirm(
                                imported.length +
                                "件のプレイリストを読み込みます。\n\n" +
                                "現在のプレイリストは置き換わります。\n" +
                                "よろしいですか？"
                            )
                        ) {

                            return;

                        }


                        playlist =
                            imported.map(
                                function(item) {

                                    return {

                                        id:
                                            item.id ||
                                            Date.now() +
                                            Math.random(),

                                        videoId:
                                            String(
                                                item.videoId
                                            ),

                                        title:
                                            String(
                                                item.title ||
                                                "YouTube動画"
                                            ),

                                        type:
                                            item.type ===
                                            "clip"
                                            ? "clip"
                                            : "video",

                                        start:
                                            Number(
                                                item.start
                                            ) || 0,

                                        end:
                                            Number(
                                                item.end
                                            ) || 0,

                                        favorite:
                                            Boolean(
                                                item.favorite
                                            )

                                    };

                                }
                            );


                        currentIndex = -1;

                        currentVideoId = null;


                        save();

                        renderPlaylist();


                        setStatus(
                            "📥 プレイリストを読み込みました！"
                        );


                        alert(
                            "📥 " +
                            playlist.length +
                            "件を復元しました！"
                        );

                    }

                    catch (e) {

                        alert(
                            "読み込みに失敗しました。\n\n" +
                            e.message
                        );

                    }

                };


            reader.readAsText(file);

            /*
               同じファイルを
               再度選択できるようにする
            */

            input.value = "";

        };


    input.click();

}


/* =========================================================
   YOUTUBE ID
========================================================= */

function youtubeId(url) {

    try {

        const u =
            new URL(url);


        if (
            u.hostname.includes(
                "youtu.be"
            )
        ) {

            return u.pathname
                .slice(1)
                .split("/")[0];

        }


        if (
            u.hostname.includes(
                "youtube.com"
            )
        ) {

            const v =
                u.searchParams.get("v");


            if (v) {

                return v;

            }


            if (
                u.pathname.includes(
                    "/shorts/"
                )
            ) {

                return u.pathname
                    .split("/shorts/")[1]
                    .split("/")[0];

            }


            if (
                u.pathname.includes(
                    "/embed/"
                )
            ) {

                return u.pathname
                    .split("/embed/")[1]
                    .split("/")[0];

            }

        }

    }

    catch (e) {}

    return null;

}

/* =========================================================
   PLAYABLE ITEMS
========================================================= */

function playableItems() {

    return playlist

        .map(
            function(item, index) {

                return {
                    item: item,
                    index: index
                };

            }
        )

        .filter(
            function(x) {

                if (
                    filter === "video"
                ) {

                    return (
                        x.item.type ===
                        "video"
                    );

                }


                if (
                    filter === "clip"
                ) {

                    return (
                        x.item.type ===
                        "clip"
                    );

                }


                if (
                    filter === "favorite"
                ) {

                    return (
                        x.item.favorite
                    );

                }


                return true;

            }
        );

}


/* =========================================================
   NEXT
========================================================= */

function nextItem() {

    const items =
        playableItems();


    if (!items.length) {

        return;

    }


    let position =
        items.findIndex(
            function(x) {

                return (
                    x.index ===
                    currentIndex
                );

            }
        );


    let next;


    if (shuffle) {

        if (items.length === 1) {

            next = 0;

        }

        else {

            do {

                next =
                    Math.floor(
                        Math.random() *
                        items.length
                    );

            }

            while (
                items[next].index ===
                currentIndex
            );

        }

    }

    else {

        next =
            position + 1;


        if (
            position === -1 ||
            next >= items.length
        ) {

            next = 0;

        }

    }


    playItem(
        items[next].index
    );

}


/* =========================================================
   PREVIOUS
========================================================= */

function previousItem() {

    const items =
        playableItems();


    if (!items.length) {

        return;

    }


    let position =
        items.findIndex(
            function(x) {

                return (
                    x.index ===
                    currentIndex
                );

            }
        );


    if (position === -1) {

        position = 0;

    }


    let prev =
        position - 1;


    if (prev < 0) {

        prev =
            items.length - 1;

    }


    playItem(
        items[prev].index
    );

}


/* =========================================================
   PLAY / PAUSE
========================================================= */

function togglePlay() {

    if (!playerReady) {

    if (currentIndex === -1) {

        if (items.length) {

            playItem(
                items[0].index

        }

        return;

    }


    const state =
        player.getPlayerState();


    if (
        state ===
        YT.PlayerState.PLAYING
    ) {

        player.pauseVideo();

    }

    else {

        player.playVideo();

    }

}

    playlist.splice(

/* =========================================================
   DRAG START
========================================================= */

function dragStart(event, index) {

    draggedIndex = index;


    event.dataTransfer.effectAllowed =
        "move";


    event.dataTransfer.setData(
        "text/plain",
        String(index)
    );


    event.currentTarget.classList.add(
        "dragging"
    );

}


/* =========================================================
   DRAG OVER
========================================================= */

function dragOver(event, index) {

    event.preventDefault();


    event.dataTransfer.dropEffect =
        "move";


    if (
        index !== draggedIndex
    ) {

        event.currentTarget.classList.add(
            "drag-over"
        );

    }

}


/* =========================================================
   DRAG LEAVE
========================================================= */

function dragLeave(event) {

    event.currentTarget.classList.remove(
        "drag-over"
    );

}


/* =========================================================
   DRAG END
========================================================= */

function dragEnd(event) {

    document
    .querySelectorAll(".song")
    .forEach(
        function(row) {

            row.classList.remove(
                "dragging"
            );

            row.classList.remove(
                "drag-over"
            );

        }
    );


    draggedIndex = null;

}


/* =========================================================
   DROP
========================================================= */

function dropItem(event, targetIndex) {

    event.preventDefault();

    event.stopPropagation();


    if (
        draggedIndex === null ||
        draggedIndex === targetIndex
    ) {

        dragEnd(event);

        return;

    }


    const moved =
        playlist.splice(
            draggedIndex,
            1
        )[0];


    playlist.splice(
        targetIndex,
        0,
        moved
    );


    /*
       再生中indexを調整
    */

    if (
        currentIndex === draggedIndex
    ) {

        currentIndex =
            targetIndex;

    }

    else if (
        draggedIndex < currentIndex &&
        targetIndex >= currentIndex
    ) {

        currentIndex--;

    }

    else if (
        draggedIndex > currentIndex &&
        targetIndex <= currentIndex
    ) {

        currentIndex++;

    }


    save();

    renderPlaylist();


    setStatus(
        "☰ プレイリストの順番を変更しました！"
    );


    draggedIndex = null;

}


/* =========================================================
   RENDER
========================================================= */

function renderPlaylist() {

    const container =
        document
        .getElementById("playlist");


    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase();


    const visible =
        playlist

        .map(
            function(item, index) {

                return {
                    item: item,
                    index: index
                };

            }
        )

        .filter(
            function(x) {

                const text =
                    x.item.title
                    .toLowerCase()
                    .includes(search);


                let typeOK = true;


                if (
                    filter === "video"
                ) {

                    typeOK =
                        x.item.type ===
                        "video";

                }


                if (
                    filter === "clip"
                ) {

                    typeOK =
                        x.item.type ===
                        "clip";

                }


                if (
                    filter === "favorite"
                ) {

                    typeOK =
                        x.item.favorite;

                }


                return (
                    text &&
                    typeOK
                );

            }
        );


    container.innerHTML = "";


    if (!visible.length) {

        container.innerHTML = `
            <div class="empty">
                まだ曲がありません
            </div>
        `;

        return;

    }


    visible.forEach(
        function(x) {

            const item =
                x.item;

            const index =
                x.index;


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "song"
                +
                (
                    index === currentIndex
                    ? " active"
                    : ""
                );


            row.draggable = true;


            row.addEventListener(
                "click",
                function() {

                    playItem(index);

                }
            );


            row.addEventListener(
                "dragstart",
                function(event) {

                    dragStart(
                        event,
                        index
                    );

                }
            );


            row.addEventListener(
                "dragover",
                function(event) {

                    dragOver(
                        event,
                        index
                    );

                }
            );


            row.addEventListener(
                "dragleave",
                dragLeave
            );


            row.addEventListener(
                "drop",
                function(event) {

                    dropItem(
                        event,
                        index
                    );

                }
            );


            row.addEventListener(
                "dragend",
                dragEnd
            );


            const thumb =
                "https://img.youtube.com/vi/"
                +
                item.videoId
                +
                "/hqdefault.jpg";


            const time =
                item.type === "clip"

                ?

                formatTime(
                    item.start
                )
                +
                " → "
                +
                formatTime(
                    item.end
                )

                :

                "通常動画";


            row.innerHTML = `

                <div
                    class="drag-handle"
                    title="ドラッグして並び替え"
                >
                    ☰
                </div>

                <img
                    class="thumb"
                    src="${thumb}"
                    onerror="
                        this.style.visibility='hidden'
                    "
                >

                <div class="info">

                    <div class="name">

                        ${
                            item.type === "clip"
                            ? "✂️ "
                            : "🎬 "
                        }

                        ${escapeHtml(
                            item.title
                        )}

                    </div>

                    <div class="meta">
                        ${time}
                    </div>

                </div>

                <button
                    class="icon ${
                        item.favorite
                        ? "favorite"
                        : ""
                    }"
                    onclick="
                        favorite(
                            ${index},
                            event
                        )
                    "
                    title="お気に入り"
                >
                    ${
                        item.favorite
                        ? "♥"
                        : "♡"
                    }
                </button>

                <button
                    class="icon"
                    onclick="
                        editItem(
                            ${index},
                            event
                        )
                    "
                    title="編集"
                >
                    ✏️
                </button>

                <button
                    class="icon"
                    onclick="
                        removeItem(
                            ${index},
                            event
                        )
                    "
                    title="削除"
                >
                    🗑
                </button>

            `;


            container.appendChild(row);

        }
    );

}


/* =========================================================
   TIME PARSE
========================================================= */

function parseTime(value) {

    if (!value) {

        return null;

    }


    const p =
        value
        .trim()
        .split(":")
        .map(Number);


    if (
        p.some(
            function(x) {

                return Number.isNaN(x);

            }
        )
    ) {

        return null;

    }


    if (p.length === 1) {

        return p[0];

    }


    if (p.length === 2) {

        return (
            p[0] * 60 +
            p[1]
        );

    }


    if (p.length === 3) {

        return (
            p[0] * 3600 +
            p[1] * 60 +
            p[2]
        );

    }


    return null;

}


/* =========================================================
   TIME FORMAT
========================================================= */

function formatTime(seconds) {

    if (
        !isFinite(seconds) ||
        seconds < 0
    ) {

        return "0:00";

    }


    seconds =
        Math.floor(seconds);


    const h =
        Math.floor(
            seconds / 3600
        );


    const m =
        Math.floor(
            (seconds % 3600) / 60
        );


    const s =
        seconds % 60;


    if (h > 0) {

        return (
            h +
            ":" +
            String(m).padStart(2, "0") +
            ":" +
            String(s).padStart(2, "0")
        );

    }


    return (
        m +
        ":" +
        String(s).padStart(2, "0")
    );

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(text) {

    const div =
        document.createElement("div");


    div.textContent = text;


    return div.innerHTML;

}

   STATUS
========================================================= */

function setStatus(text) {

    document
    .getElementById("status")
    .textContent = text;

}

            }

        }

        catch (e) {

            console.warn(
                "再生状態の復元に失敗:",
                e
            );

        }

    }


    setStatus(
        "🎉 YouTubeプレイヤー準備完了！"
    );

}



/* =========================================================
   PLAYER STATE
========================================================= */

function onPlayerStateChange(event) {

    const button =
        document.getElementById(
            "play"
        );


    if (
        event.data ===
        YT.PlayerState.PLAYING
    ) {

        button.textContent =
            "⏸";

    }

    else {

        button.textContent =
            "▶";

    }


    if (
        event.data ===
        YT.PlayerState.ENDED
    ) {

        if (repeat) {

            if (
                currentIndex >= 0
            ) {

                const item =
                    playlist[
                        currentIndex
                    ];


                if (
                    item &&
                    item.type === "clip"
                ) {

                    player.seekTo(
                        item.start,
                        true
                    );

                    player.playVideo();

                }

                else {

                    playItem(
                        currentIndex
                    );

                }

            }

        }

        else {

            nextItem();

        }

    }

}


/* =========================================================
   CLIP END CHECK
========================================================= */

setInterval(
    function() {

        if (
            !playerReady ||
            currentIndex < 0
        ) {

            return;

        }


        try {

            const item =
                playlist[
                    currentIndex
                ];


            if (
                !item ||
                item.type !== "clip"
            ) {

                return;

            }


            const current =
                player.getCurrentTime();


            if (
                current >=
                item.end - 0.25
            ) {

                if (repeat) {

                    player.seekTo(
                        item.start,
                        true
                    );

                    player.playVideo();

                }

                else {

                    nextItem();

                }

            }

        }

        catch (e) {}

    },
    250
);


/* =========================================================
   PROGRESS
========================================================= */

setInterval(
    function() {

        if (!playerReady) {

            return;

        }


        try {

            const current =
                player.getCurrentTime();


            const duration =
                player.getDuration();


            if (duration > 0) {

                document
                .getElementById(
                    "progress"
                )
                .value =
                    current /
                    duration *
                    100;


                document
                .getElementById(
                    "nowTime"
                )
                .textContent =
                    formatTime(current)
                    +
                    " / "
                    +
                    formatTime(duration);

            }

        }

        catch (e) {}

    },
    300
);

/* =========================================================
   SAVE CURRENT PLAYBACK
========================================================= */

setInterval(
    function() {

        if (
            !playerReady ||
            currentIndex < 0
        ) {

            return;

        }

        try {

            const time =
                player.getCurrentTime();

            localStorage.setItem(
                "my_music_current",
                JSON.stringify({
                    index: currentIndex,
                    time: time
                })
            );

        }

        catch (e) {}

    },
    1000
);

/* =========================================================
   PROGRESS SEEK
========================================================= */

document
.getElementById("progress")
.addEventListener(
    "input",
    function() {

        if (!playerReady) {

            return;

        }


        const duration =
            player.getDuration();


        player.seekTo(
            duration *
            Number(this.value) /
            100,
            true
        );

    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.target.tagName ===
            "INPUT"
        ) {

            return;

        }


        if (
            e.code === "Space"
        ) {

            e.preventDefault();

            togglePlay();

        }


        if (
            e.code === "ArrowLeft"
        ) {

            back10();

        }


        if (
            e.code === "ArrowRight"
        ) {

            forward10();

        }

    }
);

function showTab(tab) {

    const player =
        document.querySelector(".player");

    const sections =
        document.querySelectorAll(".section");

    const playerTab =
        document.getElementById("playerTab");

    const playlistTab =
        document.getElementById("playlistTab");


    sections.forEach(function(section) {

        const title =
            section.querySelector(".title");

        const text =
            title
            ? title.textContent.trim()
            : "";


        if (tab === "player") {

            if (
                text.includes("PLAYLIST") ||
                text.includes("テーマカラー")
            ) {

                section.style.display = "none";

            } else {

                section.style.display = "";

            }

        }


        if (tab === "playlist") {

            if (
                text.includes("YouTubeを追加")
            ) {

                section.style.display = "none";

            } else {

                section.style.display = "";

            }

        }

    });


    if (tab === "player") {

        player.style.display = "";

        playerTab.classList.add("active");
        playlistTab.classList.remove("active");

    }


    if (tab === "playlist") {

        player.style.display = "none";

        playerTab.classList.remove("active");
        playlistTab.classList.add("active");

    }

}

showTab("player");
